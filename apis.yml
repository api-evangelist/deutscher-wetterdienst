description: Deutscher Wetterdienst (DWD) is Germany's national meteorological service, a federal agency under the
  Ministry for Digital and Transport, responsible for weather and climate services, warnings, and the national climate
  archive. Its geospatial surface is an OGC-standard GeoServer at maps.dwd.de serving forecast, radar, warning and
  climate layers to any WMS or WFS client without a key.
